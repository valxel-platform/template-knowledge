[project]
name = "knowledge"
version = "0.1.0"
description = "Valxel knowledge template: retrieval over a product's own records as MCP tools, with permission-aware hybrid search, event-driven ingestion and retrieval evals."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14.3,<3",
  "pydantic-settings>=2.16,<3",
  "openfeature-sdk>=0.10,<1",
  "openfeature-provider-ofrep>=0.3,<1",
  "confluent-kafka>=2.16,<3",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "opentelemetry-instrumentation-asgi>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
  "opentelemetry-instrumentation-requests>=0.66b2",
  "pyjwt[crypto]>=2.15.1,<3",
  "sentry-sdk>=2.74.0,<3",
  "prometheus-client>=0.23,<1",
  "psycopg[binary]>=3.3.8,<4",
  "psycopg-pool>=3.2,<4",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.scripts]
knowledge-server = "knowledge.app:main"
knowledge-admin = "knowledge.admin:main"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
strict = true
packages = ["knowledge"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: needs KNOWLEDGE_TEST_DATABASE_URL (Postgres with pgvector)"]
addopts = "-q --cov=knowledge --cov-report=term --cov-report=xml --junitxml=reports/junit.xml"

[tool.coverage.report]
fail_under = 90
