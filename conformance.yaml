# The template conformance suite (.github/scripts/conformance.py, managed by the platform): the built
# image does what every knowledge repo must. A search is made with a token like an agent's; the
# embeddings come from the suite's stand-in gateway, and passages from the in-memory store.
image: "ci"  # the tag CI builds
command: "uv run knowledge-server"  # conformance.py local: the app as a process
port: 8080
audience: http://127.0.0.1:8080/mcp
env:
  KNOWLEDGE_RESOURCE_URL: http://127.0.0.1:8080/mcp
  KNOWLEDGE_OIDC_ISSUER: "{issuer}"
  KNOWLEDGE_OIDC_JWKS_URL: "{jwks}"
  KNOWLEDGE_GATEWAY_URL: "{model}"
  KNOWLEDGE_GATEWAY_KEY: conformance
  KNOWLEDGE_RERANK_MODEL: ""
  KNOWLEDGE_FLAGS_URL: "{ofrep}"
  KNOWLEDGE_PRODUCT: conformance
  KNOWLEDGE_ENVIRONMENT: ci
  KNOWLEDGE_AUDIT_SINK: log
steps:
  - method: POST
    path: /mcp
    token: {scope: "knowledge:read", organization: {north-clinic: {}}}
    headers: {accept: "application/json, text/event-stream"}
    json: {jsonrpc: "2.0", id: 1, method: tools/call, params: {name: search, arguments: {question: "knee pain follow up"}}}
    contains: ['"result"']
# No flag yet: the example tools evaluate none (a feature adds its own, flags.enabled).
checks: [audit, tracing, events]
